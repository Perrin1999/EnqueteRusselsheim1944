<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquête — L'affaire de Rüsselsheim, 1944</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
<style>
:root{ --paper:#efe6d0; --ink:#26211a; --stamp:#b91c1c; --amber:#f59e0b; }
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{ background:#0c0a09; color:#e7e5e4; font-family:'Special Elite','Courier New',monospace; min-height:100vh; }
button{ font-family:inherit; cursor:pointer; }
img{ max-width:100%; }
/* ---------- fond : le bureau de l'enquêteur ---------- */
#bg{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
#bg .wall{ position:absolute; inset:0;
 background:
 radial-gradient(ellipse at 82% 10%, rgba(255,196,110,.16), transparent 46%),
 radial-gradient(ellipse at 10% 55%, rgba(255,170,90,.07), transparent 55%),
 repeating-linear-gradient(90deg, rgba(0,0,0,.17) 0 2px, transparent 2px 13px),
 linear-gradient(168deg,#2c1b10 0%,#1e120a 50%,#130c06 100%); }
#bg .rail{ position:absolute; left:0; right:0; top:34%; height:7px; background:linear-gradient(180deg,#1c1109,#2e1b0d 60%,#150d06); box-shadow:0 4px 10px rgba(0,0,0,.5); }
#bg .board{ position:absolute; border-radius:5px;
 background:
 repeating-linear-gradient(45deg, rgba(0,0,0,.16) 0 2px, transparent 2px 9px),
 repeating-linear-gradient(135deg, rgba(255,220,160,.05) 0 1px, transparent 1px 10px),
 linear-gradient(160deg,#9a6b3e 0%,#7d5230 55%,#653f21 100%);
 box-shadow: inset 0 0 0 9px rgba(42,25,12,.95), inset 0 0 0 11px rgba(255,220,160,.10), 0 18px 40px rgba(0,0,0,.55); }
#bg .board.big{ left:1.5%; top:4.5%; width:97%; height:59%; }
#bg .pin{ position:absolute; background:#e9dcc0; padding:5px 5px 15px; box-shadow:0 7px 16px rgba(0,0,0,.5); }
#bg .pin img{ width:100%; height:auto; display:block; filter:sepia(.25) contrast(1.05) brightness(.95); }
#bg .pin i{ position:absolute; top:-5px; left:50%; margin-left:-5px; width:11px; height:11px; border-radius:50%;
 background:radial-gradient(circle at 35% 30%, #e8837a, #8f2f26 70%); box-shadow:0 2px 3px rgba(0,0,0,.55); }
#bg .cord{ position:absolute; border-top:2px dashed rgba(185,28,28,.55); transform-origin:0 0; }
#bg .note{ position:absolute; background:linear-gradient(160deg,#f3e9c8,#ddcd9e); box-shadow:0 5px 12px rgba(0,0,0,.45); padding:8px 10px; color:#4a3818; font-size:9px; line-height:1.5; }
#bg .note b{ display:block; font-size:10px; margin-bottom:2px; }
#bg .pin.deskph{ background:none; padding:0; border-radius:2px; box-shadow:0 5px 12px rgba(0,0,0,.35); }
#bg .pin.deskph i{ display:none; }
#bg .pin.deskph img{ width:auto; max-width:100%; max-height:16vh; margin:0 auto; border-radius:2px; }
#bg .stamp{ position:absolute; transform:rotate(8deg); border:3px double rgba(178,44,32,.75); color:rgba(178,44,32,.85); font-weight:700; font-size:12px; letter-spacing:.12em; padding:4px 9px; text-transform:uppercase; background:rgba(243,233,200,.12); }
#bg .deskzone{ position:absolute; left:0; right:0; bottom:0; height:31%;
 background:linear-gradient(180deg,#33200f 0%,#261608 16%,#180d05 100%); box-shadow:0 -10px 30px rgba(0,0,0,.55); }
#bg .deskzone::before{ content:""; position:absolute; left:5%; right:16%; top:10%; height:66%;
 border-radius:10px;
 background:
 repeating-radial-gradient(circle at 30% 45%, rgba(0,0,0,.12) 0 2px, transparent 2px 9px),
 radial-gradient(ellipse at 30% 45%, rgba(47,84,68,.95), rgba(20,40,30,.95) 75%);
 box-shadow:inset 0 0 0 2px rgba(255,220,160,.07), 0 4px 10px rgba(0,0,0,.4); }
#bg .sheet{ position:absolute; width:120px; height:88px; background:linear-gradient(150deg,#efe6d0,#d9cdb4); opacity:.5; box-shadow:0 4px 10px rgba(0,0,0,.4); }
#bg .sheet::before{ content:""; position:absolute; inset:9px 12px; background:repeating-linear-gradient(0deg, rgba(70,52,24,.5) 0 1px, transparent 1px 6px); }
#bg svg.lamp{ position:absolute; right:2.5%; bottom:26%; width:250px; height:44%; }
#bg .glow{ position:absolute; right:0; bottom:0; width:68%; height:75%;
 background:radial-gradient(ellipse at 88% 96%, rgba(255,196,110,.32) 0%, rgba(255,170,90,.12) 42%, transparent 72%); }
#bg .vignette{ position:absolute; inset:0; background:radial-gradient(ellipse at 52% 34%, transparent 32%, rgba(8,5,3,.5) 72%, rgba(5,3,2,.8) 100%); }
@media(max-width:860px){ #bg .board.big{ left:0; width:100%; height:46%; } #bg .note{ font-size:8px; } #bg .stamp{ font-size:10px; } #bg .pin.deskph{ width:32%; } }
/* ---------- structure ---------- */
#app{ position:relative; z-index:10; }
header.top{ position:sticky; top:0; z-index:30; background:rgba(12,10,9,.92); backdrop-filter:blur(6px); border-bottom:1px solid rgba(120,53,15,.35); }
.hbar{ max-width:72rem; margin:0 auto; padding:.7rem 1rem; display:flex; align-items:center; gap:.75rem; }
.brand-ico{ transform:rotate(-6deg); flex-shrink:0; }
.brand-ico .r{ width:40px; height:40px; border-radius:50%; border:2px solid rgba(178,44,32,.85); background:rgba(178,44,32,.12); display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--amber); }
.brand{ flex:1; min-width:0; }
.brand .l1{ font-size:11px; letter-spacing:.18em; color:#a8a29e; }
.brand .l2{ font-size:17px; font-weight:600; color:#fef3c7; }
.hbtns{ display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; }
.hbtns .vol{ width:72px; accent-color:var(--amber); vertical-align:middle; }
.hbtn{ font-size:11px; padding:.25rem .6rem; border-radius:999px; border:1px solid #44403c; background:transparent; color:#a8a29e; }
.hbtn.on{ border-color:var(--amber); color:#fcd34d; background:rgba(245,158,11,.12); }
.hbtn.fail{ border-color:#b4544a; color:#e8968c; }
.hbtn:hover{ color:#e7e5e4; }
.hsub{ max-width:72rem; margin:0 auto; padding:0 1rem .25rem; display:flex; justify-content:space-between; font-size:11px; color:#a8a29e; }
.pbarw{ height:6px; background:#292524; }
.pbar{ height:6px; background:linear-gradient(90deg,#b45309,#fbbf24); transition:width .4s; }
.shell{ max-width:72rem; margin:0 auto; padding:1rem .75rem 2rem; display:flex; gap:1.25rem; align-items:flex-start; }
aside.side{ width:256px; flex-shrink:0; position:sticky; top:110px; }
main.main{ flex:1; min-width:0; max-width:56rem; }
/* ---------- navigation ---------- */
.navbox{ border:1px solid #44403c; border-radius:16px; background:rgba(12,10,9,.85); padding:.5rem; box-shadow:0 10px 20px rgba(0,0,0,.4); }
.navbox button{ display:block; width:100%; text-align:left; border:0; background:transparent; color:#a8a29e; font-size:13px; padding:.5rem .7rem; border-radius:12px; margin-bottom:2px; }
.navbox button:hover{ background:rgba(41,37,36,.7); color:#fde68a; }
.navbox button.act{ background:rgba(245,158,11,.15); color:#fde68a; border:1px solid rgba(245,158,11,.6); }
.navbox button.done{ color:#6ee7b7; }
.navbox button:disabled{ color:#57534e; cursor:not-allowed; }
.saver{ font-size:11px; color:rgba(16,185,129,.8); margin:.7rem .25rem 0; }
.somtit{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:rgba(217,119,6,.8); padding:.3rem .5rem .2rem; }
.sombox{ border:1px solid #44403c; border-radius:16px; background:rgba(12,10,9,.85); padding:.5rem; margin-top:.75rem; }
.sombox ul{ list-style:none; max-height:240px; overflow:auto; padding-right:4px; }
.sombox button{ display:block; width:100%; text-align:left; font-size:12px; color:#a8a29e; background:transparent; border:0; padding:.4rem .5rem; border-radius:8px; margin-bottom:2px; line-height:1.35; }
.sombox button:hover{ background:rgba(41,37,36,.7); color:#fde68a; }
.sombox button:disabled{ color:#57534e; cursor:not-allowed; }
.sombox .pn{ color:rgba(217,119,6,.7); margin-right:4px; }
.sombox li.sealed{ color:#78716c; font-size:11px; font-style:italic; padding:.4rem .5rem; }
.restart{ width:100%; margin-top:.75rem; font-size:12px; padding:.5rem; border-radius:10px; border:1px solid #44403c; background:transparent; color:#a8a29e; }
.restart:hover{ color:#fca5a5; border-color:rgba(248,113,113,.5); }
#peek{ display:none; position:fixed; z-index:40; width:256px; border:1px solid rgba(146,64,14,.5); border-radius:12px; background:rgba(12,10,9,.96); box-shadow:0 12px 30px rgba(0,0,0,.5); overflow:hidden; pointer-events:none; }
#peek .ph{ padding:.4rem .7rem; font-size:10px; text-transform:uppercase; letter-spacing:.2em; color:var(--amber); font-weight:700; border-bottom:1px solid #1c1917; background:rgba(28,25,23,.9); }
#peek img{ width:100%; height:130px; object-fit:cover; display:block; }
#peek .noimg{ height:96px; display:flex; align-items:center; justify-content:center; font-size:28px; color:rgba(217,119,6,.5); }
#peek p{ padding:.5rem .7rem; font-size:12px; color:#d6d3d1; }
#livret{ display:none; position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55); overflow:auto; padding:3vh 1rem; }
#fab{ position:fixed; right:14px; bottom:14px; z-index:30; display:inline-flex; align-items:center; gap:.5rem; background:rgba(20,16,12,.94); color:#fcd34d; border:1px solid rgba(146,64,14,.65); border-radius:999px; padding:.6rem 1rem; font:700 13px Georgia,serif; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.45); }
#fab:hover{ background:rgba(32,26,18,.97); border-color:var(--amber); }
#fab .fico{ font-size:16px; }
.lvcard{ border:1px solid rgba(146,64,14,.5); background:linear-gradient(160deg,rgba(60,45,25,.5),rgba(35,28,16,.65)); border-radius:12px; padding:.75rem .9rem; margin-bottom:1rem; }
.lvcard .lvc-t{ margin:0 0 .25rem; font-size:10.5px; font-weight:800; letter-spacing:.16em; color:var(--amber); text-transform:uppercase; }
.lvcard .lvc-s{ margin:0 0 .6rem; font-size:11.5px; color:#d6c9a8; font-style:italic; }
.lvcard .lvc-b{ width:100%; background:rgba(245,158,11,.14); border:1px solid var(--amber); color:#fcd34d; border-radius:999px; padding:.4rem 0; font:700 12.5px Georgia,serif; cursor:pointer; }
.lvcard .lvc-b:hover{ background:rgba(245,158,11,.28); }
.chemise{ max-width:620px; margin:0 auto; background:linear-gradient(165deg,#d3b98b,#c2a671 55%,#b3965f); border-radius:10px 16px 16px 10px; border:1px solid #8f774a; box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 0 60px rgba(120,90,40,.25); padding:.55rem .7rem 1rem; position:relative; }
.chtop{ display:flex; justify-content:space-between; align-items:center; gap:.8rem; padding:.35rem .6rem .55rem; }
.chref{ margin:0; font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; color:#5d451a; }
.livclose{ font-size:12px; padding:.3rem .8rem; border-radius:999px; border:1px solid #8f774a; background:transparent; color:#5d451a; cursor:pointer; white-space:nowrap; }
.pagezone{ position:relative; perspective:1600px; }
.lvpage{ background:linear-gradient(178deg,#f8f0da,#f1e5c6); border-radius:4px; box-shadow:0 3px 12px rgba(50,30,5,.35), inset 0 0 40px rgba(150,110,50,.12); padding:1.1rem 1.2rem 1.3rem; width:min(100%,46.7vh); aspect-ratio:210/297; margin:0 auto; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:#b8a37a transparent; transform-origin:0 50%; transition:transform .33s cubic-bezier(.5,.05,.6,.25), opacity .33s; }
.lvpage.out{ transform:rotateY(-78deg); opacity:0; }
.lvpage.outl{ transform:rotateY(78deg); opacity:0; transform-origin:100% 50%; }
.lvpage.in{ transform:rotateY(78deg); opacity:0; transition:none; }
.lvpage.inl{ transform:rotateY(-78deg); opacity:0; transform-origin:100% 50%; transition:none; }
.turnz{ position:absolute; top:44%; transform:translateY(-50%); z-index:5; width:34px; height:56px; border:1px solid rgba(93,69,26,.4); background:rgba(211,185,139,.9); color:#5d451a; border-radius:8px; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:.75; }
.turnz:hover{ opacity:1; background:rgba(190,160,105,.95); }
.turnz.l{ left:-10px; } .turnz.r{ right:-10px; }
.lvnav{ display:flex; align-items:center; justify-content:center; gap:.9rem; padding:.8rem .2rem 0; }
.lvnav .lvbtn{ font-size:12px; padding:.35rem .85rem; border-radius:999px; border:1px solid #8f774a; background:rgba(255,250,235,.35); color:#5d451a; cursor:pointer; font-weight:700; }
.lvnav .lvbtn:hover{ background:rgba(255,250,235,.6); }
.lvnav .lvbtn:disabled{ opacity:.35; cursor:default; }
#lvpg{ margin:0; font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:#6b5527; min-width:170px; text-align:center; }
.lvcover{ text-align:center; padding:1.2rem; min-height:100%; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center; }
.lvstamp{ display:inline-block; border:3px solid var(--stamp); color:var(--stamp); font:800 13px Georgia,serif; letter-spacing:.24em; padding:6px 14px; border-radius:4px; transform:rotate(-6deg); margin-bottom:1.1rem; text-transform:uppercase; opacity:.85; }
.lvct{ margin:0 0 .4rem; font-size:26px; font-weight:800; letter-spacing:.02em; color:#3d2f14; }
.lvca{ margin:.2rem 0 .8rem; font-size:14px; font-weight:700; color:#6b5527; }
.lvcc{ margin:.2rem 0 1.4rem; font-size:12.5px; font-style:italic; color:#7a6330; }
.lvchint{ margin:0 auto; max-width:330px; font-size:12px; font-style:italic; color:#8a7444; border-top:1px dashed #a8925f; padding-top:.8rem; }
.lvpgseal{ min-height:100%; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:.9rem; background:#efe4c8; border:1px dashed #a8925f; border-radius:4px; margin:.4rem 0; padding:1rem; }
.lvseal{ width:52px; height:52px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#b8442f,#6e1d12); color:#f3d9c8; display:flex; align-items:center; justify-content:center; font:800 9px Georgia,serif; letter-spacing:.05em; transform:rotate(-8deg); box-shadow:0 2px 5px rgba(0,0,0,.35); flex-shrink:0; }
.lvps-t{ margin:0; font-weight:800; font-size:15px; color:#6b5527; }
.lvs-s{ margin:.15rem 0 0; font-size:12.5px; font-style:italic; color:#8a7444; max-width:320px; }
.lvsec{ background:rgba(255,252,240,.6); border:1px solid #c9b787; border-radius:4px; padding:.85rem 1rem .95rem; margin-bottom:0; box-shadow:0 1px 3px rgba(60,40,10,.12); }
.lvsec.done{ border-left:5px solid #5c8a4a; }
.lvsec.wip{ border-left:5px solid #c07f16; }
.lvhead2{ display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; margin-bottom:.35rem; }
.lvstampS{ font:800 9.5px Georgia,serif; letter-spacing:.14em; padding:2px 8px; border-radius:2px; border:1.5px solid; transform:rotate(-2deg); white-space:nowrap; text-transform:uppercase; }
.lvstampS.ok{ color:#2f6b1f; border-color:#2f6b1f; background:rgba(92,138,74,.08); }
.lvstampS.wip{ color:#8a5a0b; border-color:#8a5a0b; background:rgba(192,127,22,.1); }
.lvsec .lt{ margin:0; font-weight:800; font-size:14px; color:#3d2f14; }
.lvsec .lsub{ margin:.65rem 0 .15rem; font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; font-weight:700; color:#7a6330; }
.lvsec .lval{ margin:0; font-size:14px; color:#2c2314; }
.lvsec ul.lp{ margin:.2rem 0 0; padding-left:1.2rem; font-size:13.5px; }
.lvsec ul.lp li{ margin:.15rem 0; }
.lvpieces{ display:flex; flex-wrap:wrap; gap:.7rem; margin:.4rem 0 .1rem; }
.lvp{ width:150px; background:#fffdf5; border:1px solid #b8a37a; border-radius:3px; padding:5px 5px 2px; box-shadow:0 2px 6px rgba(60,40,10,.3); transform:rotate(-1.2deg); cursor:pointer; font:inherit; color:inherit; text-align:center; }
.lvp:nth-child(even){ transform:rotate(1.1deg); }
.lvp:hover{ transform:rotate(0) translateY(-3px); box-shadow:0 6px 14px rgba(60,40,10,.4); border-color:#8a6a30; }
.lvp img{ width:100%; height:105px; object-fit:cover; border-radius:2px; display:block; background:#e9dcba; }
.lvp .lvi{ width:100%; height:105px; border-radius:2px; background:#efe6d0; display:flex; align-items:center; justify-content:center; font-size:30px; color:#8a6a30; box-sizing:border-box; }
.lvp .lpn{ display:block; font-size:10px; color:#6b5527; font-weight:700; margin:.3rem 0 .25rem; line-height:1.3; }
.lvp.dim img, .lvp.dim .lvi{ opacity:.45; filter:grayscale(.7); }
.livsec ul.lp li{ margin:.15rem 0; }
.reqbloc{ border:1px dashed #57503f; border-radius:10px; padding:.7rem .9rem; margin:.8rem 0; background:rgba(20,17,14,.35); }
.objcard{ border:1px solid #44403c; border-radius:12px; padding:.9rem 1rem 1rem; margin:.9rem 0; background:rgba(28,25,23,.55); }
.objtag{ margin:0 0 .4rem; font-size:10px; letter-spacing:.18em; text-transform:uppercase; font-weight:800; color:#e8968c; }
.objarg{ margin:0 0 .5rem; font-style:italic; font-size:15px; color:#e7d8c0; line-height:1.5; }
.objq{ margin:0 0 .6rem; font-size:12.5px; font-weight:700; color:#fcd34d; }
.objopts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.6rem; }
.objopt{ position:relative; text-align:left; background:rgba(12,10,9,.8); border:1px solid #44403c; border-radius:10px; padding:.5rem; cursor:pointer; font:inherit; color:#e7e5e4; display:flex; flex-direction:column; gap:.3rem; }
.objopt:hover{ border-color:var(--amber); }
.objopt.sel{ border-color:var(--amber); box-shadow:0 0 0 1px var(--amber); }
.objopt.ok{ border-color:#7bb661; box-shadow:0 0 0 1px #7bb661; }
.objopt.ko{ border-color:#e8968c; box-shadow:0 0 0 1px #e8968c; }
.objopt img{ width:100%; height:80px; object-fit:cover; border-radius:6px; display:block; background:#1c1917; }
.objopt .oi{ height:80px; display:flex; align-items:center; justify-content:center; font-size:26px; color:rgba(217,119,6,.5); }
.objopt .opn{ font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--amber); }
.objopt .ot{ font-size:11px; line-height:1.35; color:#d6d3d1; }
.objexp{ margin-top:.7rem; border-left:3px solid #7bb661; background:rgba(20,25,18,.45); border-radius:0 8px 8px 0; padding:.55rem .8rem; font-size:12.5px; color:#e7e5e4; line-height:1.55; }
.oexp{ margin:0 0 .3rem; font-weight:800; }
.oexp.ok{ color:#7bb661; } .oexp.ko{ color:#e8968c; }
.reqbloc .rt{ margin:0 0 .25rem; font-weight:700; color:#fcd34d; font-size:14px; }
.reqbloc .ram{ margin:0 0 .55rem; font-style:italic; color:#d6c9a8; font-size:13.5px; }
#gate{ display:none; position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.55); }
#gate .gatebox{ max-width:340px; margin:18vh auto 0; background:rgba(12,10,9,.97); border:1px solid rgba(146,64,14,.5); border-radius:12px; padding:1.2rem 1.3rem; box-shadow:0 12px 30px rgba(0,0,0,.5); text-align:center; }
#gate .gt{ margin:0 0 .35rem; font-size:15px; font-weight:800; letter-spacing:.06em; color:var(--amber); }
#gate .gs{ margin:0 0 .9rem; font-size:12px; color:#d6d3d1; line-height:1.5; }
#gatein{ width:150px; box-sizing:border-box; background:rgba(28,25,23,.9); color:#e7e5e4; border:1px solid #57503f; border-radius:8px; padding:.5rem .7rem; font:600 16px Georgia,serif; text-align:center; letter-spacing:.3em; margin-bottom:.7rem; }
#gatein:focus{ outline:none; border-color:var(--amber); }
.gbtn{ background:#b4544a; color:#fff; border:0; border-radius:8px; padding:.45rem 1rem; font:600 13px Georgia,serif; cursor:pointer; }
.gbtn:hover{ background:#c96a60; }
.gbtn.ghost{ background:transparent; border:1px solid #57503f; color:#a8a29e; }
#gate .gerr{ display:none; margin:.7rem 0 0; font-size:12.5px; color:#e8968c; font-weight:700; }
.finwrap{ text-align:center; margin:1.6rem 0 .6rem; }
.finstamp{ display:inline-block; padding:.5rem 1.3rem; border:3px double var(--stamp); border-radius:6px; color:var(--stamp); font-weight:800; letter-spacing:.28em; text-transform:uppercase; transform:rotate(-3deg); font-size:14px; }
.navmob{ display:none; flex-wrap:wrap; gap:6px; margin-bottom:1rem; }
.navmob button{ font-size:12px; padding:.25rem .6rem; border-radius:999px; border:1px solid #292524; background:transparent; color:#78716c; }
.navmob button.act{ border-color:var(--amber); background:rgba(245,158,11,.15); color:#fde68a; }
.navmob button.done{ border-color:rgba(6,95,70,.6); background:rgba(6,78,59,.2); color:#6ee7b7; }
.navmob button:disabled{ cursor:not-allowed; }
/* ---------- contenus ---------- */

andrieuGreven: { img: null, titre: "L'arrivée au sol des aviateurs", source: "D'après Claire Andrieu, Tombés du Ciel. Le sort des pilotes abattus en Europe, 1939-1945, p. 333-334, Tallandier, 2021", texte: "« Le 24 août 1944, l'équipage d'un bombardier américain de retour d'une mission sur Hanovre doit sauter en parachute. Le B-24 est gravement endommagé par un tir de la Flak. Les pilotes atterrissent sur le territoire de la commune de Greven, [...]. Arrivés au sol, deux hommes sont recueillis avec humanité par des fermiers. Un troisième, Eugene Brown, est immédiatement maltraité par une petite foule dans les champs. [...] Un par un, les neuf hommes sont conduits à la mairie. À l'intérieur, les aviateurs du rang sont battus jusqu'au sang par des civils. William Adams est ensuite interrogé brutalement par l'homme en uniforme qui semble diriger les opérations. Il en sort le visage ensanglanté. Deux membres de l'équipage sont « accusés » d'être juifs, le sergent Adams et l'officier navigateur Tufenkjian. Devant leurs dénégations, ceux qui les retiennent prisonniers obligent les neuf aviateurs à baisser pantalon et sous-vêtements pour les examiner. Ils sont enfin transférés à la base aérienne locale où la Luftwaffe les traite correctement. Le sergent Brininstool, qui avait été blessé par un tir de Flak, est soigné sommairement et envoyé à l'hôpital militaire de Münster. Le lendemain 25 août, les huit prisonniers de guerre sont convoyés en train en direction du centre de transit et d'interrogation de la Luftwaffe, à Oberursel près de Francfort. De là, ils doivent être dirigés vers un camp de prisonniers. »" },
himmler: { img: null, epoque: true, titre: "Circulaire d'Himmler du 10 août 1943", source: "NARA", texte: "Le Reichsführer-SS — Quartier général, 10 août 1943\nRF/Bn — 48/16/43 g\nSecret\n\nIl n'est pas du devoir de la police d'intervenir dans les altercations entre les camarades du Volk et les aviateurs terroristes anglais et américains qui ont sauté en parachute.\n\nHimmler" },
goebbelsArt: { img: IMG.goebbels, epoque: true, titre: "« Un mot sur la terreur aérienne ennemie », article de Joseph Goebbels, ministre de l'Éducation du peuple et de la Propagande", source: "Völkischer Beobachter, 26 mai 1944", texte: "Personne ne conteste plus aujourd'hui que le terrorisme aérien ennemi ne poursuit qu'un seul but : briser le moral de la population civile allemande. L'ennemi fait la guerre à ceux qui sont sans défense, avant tout des femmes et des enfants, pour forcer les hommes de notre pays à céder. [...] Personne ne s'étonnera que les populations touchées, connues dans le monde entier pour comprendre toutes les lois de la guerre, soient saisies d'une rage légitime devant des crimes aussi cyniques. C'est seulement grâce à l'intervention de la force armée qu'il a été possible de sauver des pilotes ennemis qui, autrement, auraient été battus à mort par la population locale. Qui a raison ici ? Les meurtriers qui après leurs lâches crimes attendent un traitement humain de la part de leurs victimes, ou les victimes qui souhaitent se défendre elles-mêmes selon le principe « œil pour l'œil, la dent pour la dent » ? La question n'est pas difficile à trancher. Dans tous les cas, ce serait trop nous demander que de nous faire utiliser des soldats allemands pour la défense d'assassins d'enfants contre des parents qui, saisis de fureur et de rage pour avoir perdu leurs trésors les plus chers à cause du cynisme brutal de l'ennemi, recourent à la légitime défense. [...] Il nous semble à peine possible, et à peine acceptable, de retourner la police et les soldats allemands contre le peuple allemand lorsque les meurtriers d'enfants recevront ce qu'ils méritent. Les crimes militaires anglo-américains doivent cesser à un moment ou un autre. [...]" },
goebbelsJournal: { img: null, epoque: true, titre: "Journal de Joseph Goebbels, 10 juin 1944", source: null, texte: "Des lettres reçues, je conclus que mon article sur le « lynchage » des pilotes a reçu un accueil formidable. Le peuple allemand ne veut plus entendre parler d'esprit chevaleresque ou d'humanité dans la conduite de cette guerre dont dépend notre destin. Rarement l'un de mes articles aura produit autant d'effet que celui-ci. L'un dans l'autre, le peuple réclame que nous menions une guerre plus ferme et plus totale." },
bormann: { img: IMG.bormann, epoque: true, titre: "Circulaire de Martin Bormann, chancelier du NSDAP, du 30 mai 1944", source: "NARA", texte: "Objet : Justice du peuple contre les assassins anglo-américains\n\nLes aviateurs anglais et nord-américains ont dans ces dernières semaines tiré à plusieurs reprises en volant en rase-mottes à basse altitude sur des aires de jeux pour enfants, sur des femmes et des enfants travaillant aux champs, sur les routes de campagne, sur des trains, etc., et ont ainsi assassiné des civils sans défense, en particulier des femmes et des enfants.\n\nIl est arrivé plusieurs fois que des équipages qui avaient sauté en parachute ou avaient été forcés d'atterrir aient été lynchés immédiatement et sur place par la population extrêmement indignée.\n\nCes camarades du Volk n'ont pas fait l'objet de poursuites policières et pénales.\n\nSigné M. Bormann" },
kladd1: { img: IMG.kladd1, descriptif: true, titre: "« En avant, soldats chrétiens », dessin de presse de la propagande nazie", source: "Kladderadatsch, 18 juillet 1943", texte: "Ce dessin de presse offre un condensé des croyances nazies sur les bombardements alliés. Un clerc mi-anglican mi-juif au sens nazi « judéo-anglais » se réjouit alors qu'un aviateur noir aux apparences de singe bombarde une ville allemande." },

andrieuBomb: { img: null, titre: "Le bombardement de Rüsselsheim", source: "D'après Claire Andrieu, Tombés du Ciel, p. 334-335, Tallandier, 2021", texte: "Mais dans la nuit du 25 au 26, la RAF a bombardé le siège des usines Opel à Rüsselsheim, une petite ville à la fois industrielle et rurale, à une trentaine de kilomètres de Francfort. Les usines produisent pour la Luftwaffe des Junkers-88, des bombardiers qui combattent en première ligne. [...] Le bombardement de la nuit du 25 au 26 août a coupé la ligne de chemin de fer en amont. Au matin du 26, les huit Américains conduits par deux gardes de la Luftwaffe arrivent donc à pied à Rüsselsheim. Les soldats de l'escorte espèrent trouver là un train qui roule. Dans cette petite ville de 16 000 habitants, l'atmosphère est tendue. Après une nuit sans sommeil, les habitants sont debout, déblayant les débris, discutant des événements. C'est le dixième bombardement depuis le début de la guerre [...], et le troisième en cinq semaines. Le plus meurtrier aura été celui du 20 juillet 1944 (65 habitants de la ville tués, 157 Allemands au total). Le 26 août, on déplore 20 tués (21 Allemands au total en comptant un habitant d'un bourg voisin) et on constate le décès de 177 travailleurs forcés et prisonniers de guerre dont les baraques jouxtaient l'usine. [...] Au total, sur la durée de la guerre, 45 % des bâtiments de la ville ont été endommagés par les bombardements, de légèrement à totalement." },
preuves: { img: IMG.preuves, epoque: true, titre: "Extraits du dossier de l'affaire 12-1497 (US vs. Josef Hartgen) — preuves réunies par l'accusation", source: "NARA", texte: "« Mme Margarete Witzler et sa sœur, Mme Käthe Reinhardt, virent les aviateurs et se mirent à crier : \"Mettez-les en pièces. Battez-les à mort. Ce sont eux, ce sont eux qui étaient là cette nuit. Ce sont les pilotes terroristes de cette nuit. Tuez ces chiens. Nous ne pouvons pas avoir pitié d'eux.\" »\n\n« Joseph Hartgen, un responsable du parti et chef de la propagande de Rüsselsheim, était présent dans la foule. À ce moment, il tira un coup de revolver. Les deux femmes continuèrent à crier, ramassèrent des pierres et les jetèrent sur les aviateurs [...]. Philipp Gutlich, qui se trouvait dans la foule, frappa les aviateurs avec un bâton qu'il tenait à deux mains plusieurs fois. »\n\n« Georg Daum, qui déblayait des décombres à l'arrière de sa maison dans la Taunusstrasse, accourut dans la rue derrière les aviateurs et les frappa avec sa pelle. »\n\n« Johannes Seipel s'approcha de lui et le frappa d'un coup de pied au cou et au menton. »\n\n« August Wolf se tenait sur un tas de bois derrière le mur, près des voies. Lui et Karl Fugmann jetèrent des pierres sur les aviateurs. Friedrich Wust se pencha par-dessus le mur et asséna à l'un des aviateurs un ou deux coups. Il frappa les Américains avec force plusieurs fois. »\n\n« Johann Opper excitait la foule et la « stimulait », et frappa lui-même les aviateurs plusieurs fois. Joseph Hartgen les frappa à plusieurs reprises. Il abattit ensuite les Américains d'un coup de feu ; ceux-ci gisaient alors, entassés contre le mur. »" },

andrieuLynch: { img: null, titre: "« Rüsselsheim, 26 août 1944 : un lynchage modèle »", source: "D'après Claire Andrieu, Tombés du Ciel, p. 334-335, Tallandier, 2021", texte: "Pénétrant dans la ville les uns derrière les autres et soutenant tour à tour Dumont qui a abîmé sa cheville en arrivant au sol, les aviateurs marchent dans la Mainzer Strasse, parallèle au Main qui coule d'est en ouest. Ils ne remarquent peut-être pas sur leur gauche la synagogue qui a été vandalisée par des habitants du lieu lors de la Nuit de Cristal. Elle n'a pas été complètement détruite, car des locataires « aryens » habitaient au-dessus. [...] Quelque 200 mètres plus loin, les prisonniers sous escorte arrivent sur la place du marché, encombrée de débris de bâtiments. L'église évangélique est debout, mais la place est couverte de poutres, de morceaux de briques et de tuiles. L'hostilité des habitants est visible. Ils se rassemblent autour des aviateurs. Pour aller à la gare, le petit convoi ne peut pas tourner à droite, directement dans la Marktstrasse, car elle n'est pas déblayée. Les hommes continuent vers l'est, dans la Frankfurterstrasse qui est en bon état. De plus en plus pressés par la petite foule, ils passent devant le commissariat de police. À gauche, juste derrière le rang de maisons, se trouve le vieux quartier juif de la ville. La « Maison des Juifs », Judenhaus, dans laquelle les derniers Juifs ont été concentrés avant leur déportation en 1942, est située là, à deux pas, sur la Schäfergasse. Au débouché de cette petite rue, à hauteur du 10, Frankfurterstrasse ou quelques mètres plus loin, des cris de femmes retentissent : « Battez-les à mort ! », « Tuez ces chiens ! », « Ce sont eux qui ont détruit nos maisons ! », « Ce sont les pilotes terroristes ! ». Deux sœurs lancent ces appels au meurtre, deux épouses et mères, âgées respectivement de 38 et 50 ans, propriétaires d'un petit tabac au 10 de la Frankfurterstrasse. Elles créent l'événement, au sens littéral. Tout en criant, Käthe Reinhardt, la cadette, lance une brique à la tête d'un aviateur. Le sang coule. L'agresseur poursuit à coups de poing. Sa sœur, Margarete Witzler, l'imite.\n\nLe lynchage commence donc sur la Frankfurterstrasse et se poursuit le long de la Taunusstrasse et de la Grabenstrasse, en direction de la gare. Josef Hartgen, contremaître chez Opel et chef local de la propagande du NSDAP, arrive sur les lieux et tire un coup de feu en l'air, ce qui accroît le tumulte. [...] Le lynchage se développe alors sans entrave, sur un trajet de quelques 800 mètres. Les gardes laissent faire. Un policier présent laisse faire. Un instituteur local en retraite, Christophe Keil, demande à ces représentants de l'armée et de la police de s'interposer, en vain. Les aviateurs franchissent cette distance en trois quarts d'heure ou plus, entourés d'une foule hurlante qui leur lance des briques, et leur donne des coups de pelle et de pierres, d'outils agricoles. Face aux cris de « Juif ! Juif ! » (Jude ! Jude !), William Adams tente de nouveau de convaincre qu'il n'est pas juif. En raison de ses origines hollandaises de Pennsylvanie, il parle un peu d'allemand. Ce n'est pas le cas de Haigus Tufenkjian, qui ne comprend pas. À mi-chemin dans la Taunusstrasse, un aviateur en sang, un morceau de tuile fiché dans le crâne, tombe assis. Un fermier âgé de 67 ans l'achève à coups de pied dans la gorge et au menton.\n\nLa taille de la foule augmenta, jusqu'à atteindre peut-être 200 personnes. [...] Un à un les aviateurs encore debout s'effondrent. Eugene Brown dira dans son témoignage : « Je suis tombé peu après et j'ai fait l'opossum [fait le mort comme le fait l'opossum]. Ils ont dû penser que j'étais mort car j'étais couvert de sang à cause des coups que j'avais reçus sur la tête. » Un maréchal-ferrant de 47 ans cogna plusieurs aviateurs à terre avec son marteau. Des participants menacent Christoph Keil : « Dégage ou ce sera ton tour », lui crie un cheminot. Après avoir battu les aviateurs et incité la foule à l'imiter, le chef de la propagande locale vide son chargeur dans la tête de quatre des hommes tombés. La foule se disperse. Plusieurs participants rentrent chez eux. En chemin, ils expriment leur contentement aux passants. Un aubergiste-fermier se plaint d'avoir mal aux mains d'avoir tant frappé avec son bâton.\n\nPlus tard dans la matinée, des enfants âgés de 8 à 12 ans, dont certains en uniforme de la Hitlerjugend, chargent les corps des aviateurs sur une charrette. En uniforme de SA, un participant du lynchage, charpentier de son état, les dirige. Des enfants avaient d'ailleurs participé activement au lynchage. Ils poussent maintenant joyeusement la charrette jusqu'au cimetière. Ils arrivent sur la place centrale de celui-ci lorsqu'une alerte aérienne disperse le groupe. Dans la charrette, quatre hommes au moins vivent encore. Le SA monte sur le véhicule et cogne à nouveau, après quoi seuls deux aviateurs demeurent conscients, Eugene Brown et William Adams. Mettant à profit l'alerte, ils se glissent dans la chapelle attenante, puis s'échappent dans la campagne. Ils seront repris quelques jours plus tard et envoyés en camp de prisonniers. Au cimetière de Rüsselsheim, Hartgen, le contremaître chef de la propagande locale, revient dans l'après-midi et tire des coups de feu. Aucun des aviateurs ne survit à ce dernier geste. Des prisonniers russes sont requis pour creuser une fosse. L'endroit choisi est celui de l'ancien carré juif du cimetière, profané et désaffecté depuis la Nuit de Cristal. Les six corps sont jetés à même la terre. Le pilote Norman J. Rogers Jr., le copilote John R. Sekul, le navigateur Haigus Tufenkjian, l'opérateur radio Thomas D. Williams Jr., le mitrailleur ventral William A. Dumont et le mitrailleur latéral gauche Elmore L. Austin ont perdu la vie. [...]" },

function canValidate(){
 var et=ETAPES[state.step], sid=et.id;
 if(state.validated[sid]) return false;
 if(sid===0 && !String(state.answers["enqueteur"]||"").trim()) return false;
 if(sid===0 && !state.answers["lettreOuverte"]) return false;
 for(var i=0;i<et.qcm.length;i++){ if(state.answers[aKey("qcm",sid,i)]===undefined) return false; }
 if(et.surlignages){ for(var s=0;s<et.surlignages.length;s++){ if(state.answers[aKey("surlState",sid,s)]!=="ok") return false; } }
 if(et.trous){ if(state.answers[aKey("trouState",sid,0)]!=="ok") return false; }
 if(et.hotspots){ for(var hh=0;hh<et.hotspots.length;hh++){ var v=state.answers[aKey("hs",sid,hh)]||[]; if(v.length<et.hotspots[hh].zones.length) return false; } }
 if(et.association){ var sel=state.answers[aKey("assoc",sid,0)]||{}; if(Object.keys(sel).length<et.association.paires.length) return false; }
 if(et.frise){ var p=state.answers[aKey("frise",sid,0)]||[]; if(p.length!==et.frise.evenements.length) return false; }
 for(var o=0;o<et.ouvertes.length;o++){ if(!String(state.answers[aKey("open",sid,o)]||"").trim()) return false; }
 if(et.audience){ for(var a2=0;a2<et.audience.objections.length;a2++){ if(state.answers[aKey("aud",sid,a2)]===undefined) return false; } }
 return true;
}
function validateStep(){
 var et=ETAPES[state.step], sid=et.id;
 if(et.frise){ var p=state.answers[aKey("frise",sid,0)]||[];
  var ok=p.length===et.frise.evenements.length && p.every(function(v,i){ return v===et.frise.ordre[i]; });
  state.answers[aKey("friseState",sid,0)]=ok?"ok":"ko"; if(!ok){ saveDeb(); render(); return; } }
 if(et.association){ var sel=state.answers[aKey("assoc",sid,0)]||{};
  var ok2=et.association.paires.every(function(pp,i){ return sel[i]===i; });
  state.answers[aKey("assocState",sid,0)]=ok2?"ok":"ko"; if(!ok2){ saveDeb(); render(); return; } }
 state.showQcm[sid]=true; state.validated[sid]=true; sfxStamp(); save(); render();
}
function buildReport(){
 var L=["ENQUÊTE RÜSSELSHEIM 1944 — RAPPORT D'ENQUÊTE","Enquêteur : "+(String(state.answers["enqueteur"]||"").trim()||"(non renseigné)"),""];
 ETAPES.forEach(function(e){
  if(e.final) return;
  L.push("=== "+e.titre+" ===");
  if(e.surlignages){ e.surlignages.forEach(function(it,i){ var sel=state.answers[aKey("surl",e.id,i)]||[]; var st=state.answers[aKey("surlState",e.id,i)];
   L.push("Question "+QNUM[e.id+"-surl-"+i]+" (surlignage) : "+it.titre);
   L.push("  Passages relevés : "+(sel.length?sel.map(function(j){ return it.segments[j]; }).join(" | "):"(aucun)"));
   L.push("  Résultat : "+(st==="ok"?"validé":st==="ko"?"dernier essai incorrect":"(non vérifié)")); }); }
  if(e.hotspots){ e.hotspots.forEach(function(it,i){ var vis=state.answers[aKey("hs",e.id,i)]||[];
   L.push("Analyse d'image : "+it.titre);
   L.push("  Repères explorés : "+vis.length+"/"+it.zones.length); }); }
  e.qcm.forEach(function(q,i){ var v=state.answers[aKey("qcm",e.id,i)];
   L.push("Question "+QNUM[e.id+"-qcm-"+i]+" : —");
   L.push("  Réponse : "+(v!==undefined?String.fromCharCode(65+v):"(sans réponse)")); });
  if(e.association){ var sel2=state.answers[aKey("assoc",e.id,0)]||{}; L.push("Question "+QNUM[e.id+"-assoc-0"]+" (association) : "+(e.association.titre||""));
   e.association.paires.forEach(function(p,i){ L.push("  "+p.nom+" → "+(sel2[i]!==undefined?e.association.paires[sel2[i]].acte:"(non associé)")); }); }
  if(e.trous){ L.push("Question "+QNUM[e.id+"-trou-0"]+" (texte à trous) : mots à compléter");
   L.push("  Mots saisis : "+e.trous.trous.map(function(w,j){ return String(state.answers[aKey("trou",e.id,j)]||"?"); }).join(" | "));
   var tst=state.answers[aKey("trouState",e.id,0)];
   L.push("  Résultat : "+(tst==="ok"?"validé":tst==="ko"?"dernier essai incorrect":"(non vérifié)")); }
  if(e.frise){ L.push("Question "+QNUM[e.id+"-frise-0"]+" (chronologie) : ordre reconstitué des événements");
   var p2=state.answers[aKey("frise",e.id,0)]||[];
   p2.forEach(function(v,i){ L.push("  "+(i+1)+". "+e.frise.evenements[v]); });
   if(!p2.length){ L.push("  (non reconstituée)"); } }
  e.ouvertes.forEach(function(q,i){ L.push("Question "+QNUM[e.id+"-open-"+i]+" (analyse) : "+q.q);
   L.push("  "+(String(state.answers[aKey("open",e.id,i)]||"").trim()||"(sans réponse)")); });
  if(e.audience){ e.audience.objections.forEach(function(o,oi){ var v=state.answers[aKey("aud",e.id,oi)];
   L.push("Question "+QNUM[e.id+"-aud-"+oi]+" (audience) : objection "+(oi+1));
   L.push("  Pièce choisie : "+(v!==undefined?"n° "+PNUM[o.options[v]]+" — "+DOCS[o.options[v]].titre:"(sans réponse)")); }); }
  L.push("");
 });
 L.push("Score QCM : "+scoreQcm()+" / "+totalQcm());
 return L.join("\n");
}

function epilogueHTML(){

function reportHTML(){
 return '<div class="report"><h2>Dossier clos — Rapport d\'enquête</h2>'
 +'<p class="ri">Ton enquête est terminée : '+scoreQcm()+'/'+totalQcm()+' aux questions de vérification. Copie ton rapport d\'enquête complet (réponses QCM avec correction, éléments relevés, chronologie, réponses d\'analyse et tes réponses à l\'audience finale) et dépose-le sur l\'ENT ou envoie-le à ton professeur pour qu\'il établisse ta note.</p>'
 +'<pre>'+esc(buildReport())+'</pre>'
 +'<button id="copybtn" class="copybtn" onclick="G.copyReport()">Copier le rapport d\'enquête</button></div>';
}

// ================= page =================
function mainContentHTML(){
 var et=ETAPES[state.step], sid=et.id;
 var h=navMobHTML()+'<h1 class="steph">'+esc(et.titre)+'</h1>';
 if(sid===0){ h+=lettreHTML(); }
 else {
  h+='<div class="narr">'+esc(et.narrative)+'</div>';
  if(et.docs.length){
   h+='<div class="docsbox"><p class="doctit">— Pièces du dossier —</p>';
   et.docs.forEach(function(k){ h+=docCardHTML(k,et); });
   h+='</div>';
  }
 }
 if(sid===0 && et.docs.length){
  h+='<div class="docsbox"><p class="doctit">— Pièces du dossier —</p>';
  et.docs.forEach(function(k){ h+=docCardHTML(k,et); });
  h+='</div>';
 }
 if(et.final){
  h+=epilogueHTML();
  h+=reportHTML();
 } else {
  h+='<div class="qbox"><p class="doctit">'+(et.audience?'— L\'audience : réponds à la défense —':'— Questions du procureur —')+'</p>';
  if(et.surlignages){ et.surlignages.forEach(function(s,i){ h+=surlHTML(s,sid,i); }); }
  et.qcm.forEach(function(q,i){ h+=qcmHTML(q,sid,i,state.showQcm[sid]||state.teacher); });
  if(et.association){ h+=matchHTML(et.association,sid); }
  if(et.trous){ h+=trouHTML(et.trous,sid); }
  if(et.frise){ h+=friseHTML(et.frise,sid); }
  et.ouvertes.forEach(function(q,i){ h+=openQHTML(q,sid,i); });
  if(et.audience){ h+=audienceHTML(et,sid); }
  h+=validHTML(et);
  h+='</div>';
 }
 h+='<p class="foot">Jeu d\'enquête pédagogique inspiré de The Darkest Files · Séquence histoire 3e — Seconde Guerre mondiale, guerre d\'anéantissement. · Site v1</p>';
 return h;
}
function refreshVbtn(){
 var b=document.getElementById("vbtn"); if(!b)return;
 var ok=canValidate();
 b.className="vbtn "+(ok?"ok":"no"); b.disabled=!ok;
 b.textContent=ok?"Valider la partie":"Réponds à toutes les questions pour valider";
}
function copyText(t){
 try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t); return; } }catch(e){}
 try{ var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }catch(e){}
}
function render(){
 ZOOMREG={}; zoomN=0;
 document.getElementById("app").innerHTML=headerHTML()+'<div class="shell">'+sideHTML()+'<main class="main">'+mainContentHTML()+'</main></div>';
}

// ================= handlers =================
window.G={
 go:function(i){ state.step=i; render(); },
 toggleSfx:function(){ state.sfxOn=!state.sfxOn; render(); },
 gateTeacher:function(){
  var g=document.getElementById("gate");
  if(!g) return;
  if(state.teacher){ state.teacher=false; render(); return; }
  g.style.display="block";
  var i=document.getElementById("gatein");
  if(i){ i.value=""; try{ i.focus(); }catch(e){} }
 },
 gateCheck:function(){
  var g=document.getElementById("gate"), i=document.getElementById("gatein"), m=document.getElementById("gatemsg");
  if(!g||!i) return;
  if(String(i.value).trim()==="1944"){ g.style.display="none"; state.teacher=true; render(); }
  else { if(m){ m.style.display="block"; } i.value=""; try{ i.focus(); }catch(e){} }
 },
 gateClose:function(){ var g=document.getElementById("gate"); if(g){ g.style.display="none"; } },
 toggleMusic:function(){ state.musicOn=!state.musicOn; var a=ensureMusic(); if(state.musicOn){ state.musicFail=false; musicErrs=0; a.load(); a.play().catch(function(){ if(musicErrs>=3) failMusic(); }); } else { a.pause(); } render(); },
 setVol:function(v){ v=Number(v); if(isNaN(v))return; v=Math.min(1,Math.max(0,v)); state.vol=v; if(musicEl){ musicEl.volume=v; } save(); },
 pickMusic:function(){ var mp=document.getElementById("musicpick"); if(mp){ try{ mp.value=""; }catch(e){} mp.click(); } },
 name:function(v){ setAQ("enqueteur",v); var hh=document.getElementById("envhint"); if(hh){ var n=String(v||"").trim(); hh.innerHTML="Clique sur l\'enveloppe pour ouvrir la lettre du procureur"+(n?"":" (indique d\'abord ton nom)")+"."; } },
 openLetter:function(el){
  if(state.answers["lettreOuverte"])return;
  if(!String(state.answers["enqueteur"]||"").trim())return;
  sfxPaper(); el.classList.add("opening");
  setTimeout(function(){ setA("lettreOuverte",true); },900);
 },
 openDoc:function(k,el){
  if(state.answers["doc-"+k])return;
  sfxPaper(); el.classList.add("opening");
  setTimeout(function(){ setA("doc-"+k,true); },700);
 },
 tab:function(k,t){ ui.tabs[k]=t; render(); },
 surlToggle:function(sid,idx,j){
  if(state.answers[aKey("surlState",sid,idx)]==="ok")return;
  var s=(state.answers[aKey("surl",sid,idx)]||[]).slice();
  var p=s.indexOf(j); if(p>=0){ s.splice(p,1); } else { s.push(j); }
  setA(aKey("surl",sid,idx),s);
 },
 surlCheck:function(sid,idx){
  var it=ETAPES[state.step].surlignages[idx];
  var s=state.answers[aKey("surl",sid,idx)]||[];
  var ok=s.length===it.ok.length&&it.ok.every(function(j){ return s.indexOf(j)>=0; });
  if(ok){ sfxStamp(); }
  setA(aKey("surlState",sid,idx),ok?"ok":"ko");
 },
 trou:function(sid,j,el){
  if(state.answers[aKey("trouState",sid,0)]==="ok")return;
  setAQ(aKey("trou",sid,j),el.value); refreshVbtn();
 },
 trouCheck:function(sid){
  var it=ETAPES[state.step].trous;
  var ok=it.trous.every(function(w,j){ var v=String(state.answers[aKey("trou",sid,j)]||"").trim().toLowerCase(); return v===String(w).trim().toLowerCase(); });
  if(ok){ sfxStamp(); }
  setA(aKey("trouState",sid,0),ok?"ok":"ko");
 },
 hs:function(sid,idx,zi,k){
  var v=state.answers[aKey("hs",sid,idx)]||[];
  ui.hz[k]=zi;
  if(v.indexOf(zi)<0){ setA(aKey("hs",sid,idx),v.concat([zi])); } else { render(); }
 },
 qcm:function(sid,i,j){ if(state.showQcm[sid]||state.validated[sid])return; setA(aKey("qcm",sid,i),j); },
 openQ:function(sid,i,el){ setAQ(aKey("open",sid,i),el.value); refreshVbtn(); },
 pickAud:function(sid,oi,ki){ setAQ(aKey("aud",sid,oi),ki); refreshVbtn(); render(); },
 toggleLivret:function(){ var lv=document.getElementById("livret"); if(!lv)return; if(lv.style.display!=="block"){ lv.innerHTML=livretHTML(); lvSyncNav(); lv.style.display="block"; } else { lv.style.display="none"; } },
 closeLivret:function(){ var lv=document.getElementById("livret"); if(lv){ lv.style.display="none"; } },
 lvTurn:function(dir){
  var z=document.getElementById("lvpage"); if(!z) return;
  var np=(typeof lvPage==="number"?lvPage:0)+dir;
  if(np<0||np>ETAPES.length) return;
  sfxPaper();
  var cl=(dir>0?"out":"outl");
  z.classList.add(cl);
  setTimeout(function(){
   lvPage=np;
   z.innerHTML=livretPageHTML(np);
   z.classList.remove(cl);
   z.classList.add(dir>0?"in":"inl");
   void z.offsetWidth;
   z.classList.remove("in");
   z.classList.remove("inl");
   lvSyncNav();
  },330);
 },
 goToPiece:function(s){ var lv=document.getElementById("livret"); if(lv){ lv.style.display="none"; } window.G.go(s); },
 assocPick:function(sid,i){
  var sel=state.answers[aKey("assoc",sid,0)]||{};
  var st=state.answers[aKey("assocState",sid,0)];
  if(sel[i]!==undefined&&st!=="ok"){
   var s={}; for(var k in sel){ s[k]=sel[k]; } delete s[i];
   setA(aKey("assoc",sid,0),s);
  } else {
   ui.picked[sid]=i; render();
  }
 },
 assocAssign:function(sid,ai){
  var p=ui.picked[sid];
  if(p===undefined||p===null)return;
  if(state.validated[state.step])return;
  var sel=state.answers[aKey("assoc",sid,0)]||{};
  var s={}; for(var k in sel){ s[k]=sel[k]; }
  s[p]=ai; ui.picked[sid]=null;
  setA(aKey("assoc",sid,0),s);
 },
 frisePlace:function(sid,j){
  if(state.validated[state.step])return;
  var p=(state.answers[aKey("frise",sid,0)]||[]).slice(); p.push(j);
  setA(aKey("frise",sid,0),p);
 },
 friseReset:function(sid,pos){
  var p=(state.answers[aKey("frise",sid,0)]||[]).slice(); p.splice(pos,1);
  setA(aKey("frise",sid,0),p);
 },
 validate:function(){ validateStep(); },
 copyReport:function(){
  copyText(buildReport());
  var b=document.getElementById("copybtn");
  if(b){ b.textContent="Rapport copié ✓"; setTimeout(function(){ b.textContent="Copier le rapport d\'enquête"; },2500); }
 },
 restart:function(){
  if(!window.confirm("Recommencer l\'enquête ? Toutes tes réponses seront effacées."))return;
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  state.answers={}; state.validated={}; state.showQcm={}; state.step=0;
  ui.tabs={}; ui.hz={}; ui.picked={};
  var lv=document.getElementById("livret"); if(lv){ lv.style.display="none"; }
  render();
 },
 zoomK:function(id){
  var z=ZOOMREG[id]; if(!z)return;
  var lb=document.getElementById("lb");
  if(!lb){ lb=document.createElement("div"); lb.id="lb"; document.body.appendChild(lb); }
  lb.className="lightbox"; lb.style.display="flex";
  lb.innerHTML='<img src="'+esc(z.src)+'" alt="'+esc(z.alt)+'"><p class="lx">Clique n\'importe où pour fermer</p>';
  lb.onclick=function(){ lb.style.display="none"; lb.innerHTML=""; };
 },
 peekIn:function(k,ev){
  var d=DOCS[k]; var src=d.images?d.images[0].src:d.img;
  var pk=document.getElementById("peek");
  pk.style.left=Math.min(ev.clientX+24,window.innerWidth-290)+"px";
  pk.style.top=Math.max(12,ev.clientY-90)+"px";
  pk.innerHTML='<div class="ph">Pièce n° '+PNUM[k]+'</div>'
  +(src?'<img src="'+esc(src)+'" alt="">':'<div class="noimg">&#9638;</div>')
  +'<p>'+esc(d.titre)+'</p>';
  pk.style.display="block";
 },
 peekOut:function(){ document.getElementById("peek").style.display="none"; }
};

// ================= init =================
document.getElementById("bg").innerHTML=bgHTML();
render();

</script>
</body>
</html>
